[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:ollama]
command=ollama serve
autostart=true
autorestart=true
stderr_logfile=/var/log/ollama.err.log
stdout_logfile=/var/log/ollama.out.log
environment=OLLAMA_HOST="0.0.0.0:11434"

[program:openviking]
command=/usr/local/bin/openviking-entrypoint
autostart=true
autorestart=true
stderr_logfile=/var/log/openviking.err.log
stdout_logfile=/var/log/openviking.out.log
environment=HOME="/app",PATH="/app/.venv/bin:%(ENV_PATH)s",OPENVIKING_CONFIG_FILE="/app/.openviking/ov.conf",OPENVIKING_CLI_CONFIG_FILE="/app/.openviking/ovcli.conf"
